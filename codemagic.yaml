workflows:
  ios-workflow:
    name: Build iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build iOS
        script: |
          xcodebuild -project AppForTest.xcodeproj \
            -scheme AppForTest \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath build/AppForTest.xcarchive \
            archive
      
      - name: Create unsigned IPA
        script: |
          mkdir -p build/Payload
          cp -R build/AppForTest.xcarchive/Products/Applications/AppForTest.app build/Payload/
          cd build
          zip -r AppForTest-unsigned.ipa Payload/
    artifacts:
      - build/AppForTest-unsigned.ipa
