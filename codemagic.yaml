workflows:
  ios-workflow:
    name: Build iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Resolve Swift packages
        script: |
          xcodebuild -project AppForTest.xcodeproj \
            -scheme AppForTest \
            -resolvePackageDependencies
      
      - name: Build iOS
        script: |
          xcodebuild -project AppForTest.xcodeproj \
            -scheme AppForTest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      
      - name: Create unsigned IPA
        script: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/AppForTest.app build/Payload/
          cd build
          zip -r AppForTest-unsigned.ipa Payload/
    artifacts:
      - build/AppForTest-unsigned.ipa
