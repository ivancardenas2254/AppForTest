syntax = "proto3";

package protocol.v1;

option go_package = "example.com/device-server/gen/protocol/v1;protocolv1";

// La version del protocolo se identifica con /v1/ en la URL. Cada endpoint
// HTTP determina el tipo de mensaje que se envia y se recibe.

// POST /v1/devices/register
message RegisterDeviceRequest {
  bytes client_instance_id = 1;
  string device_name = 2;
}

message RegisterDeviceResponse {
  bytes device_id = 1;
}

// POST /v1/transfers
message TransferBeginRequest {
  bytes device_id = 1;
  bytes transfer_id = 2;
  string file_name = 3;
  uint64 file_size = 4;
  bytes file_hash = 5; // SHA-256: exactamente 32 bytes.
  string content_type = 6;
  string application_id = 7;
  string data_category = 8; // photo, video, audio, document, other, etc.
  string source_record_id = 9; // identificador estable opcional del registro origen.
}

message TransferBeginResponse {
  uint32 next_chunk_index = 1;
  uint64 next_chunk_offset = 2;
  uint32 max_chunk_size = 3;
}

// POST /v1/transfers/chunk
message TransferChunkRequest {
  bytes device_id = 1;
  bytes transfer_id = 2;
  uint32 chunk_index = 3;
  uint64 chunk_offset = 4;
  bytes chunk_data = 5;
}

message TransferChunkResponse {
  uint32 next_chunk_index = 1;
  uint64 next_chunk_offset = 2;
}

// POST /v1/transfers/status
message TransferStatusRequest {
  bytes device_id = 1;
  bytes transfer_id = 2;
}

message TransferStatusResponse {
  uint32 next_chunk_index = 1;
  uint64 next_chunk_offset = 2;
  bool completed = 3;
}

// POST /v1/transfers/commit
message TransferCommitRequest {
  bytes device_id = 1;
  bytes transfer_id = 2;
}

message TransferCommitResponse {
  bool success = 1;
}

// POST /v1/devices/list
message ListDevicesRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message DeviceInfo {
  bytes device_id = 1;
  string device_name = 2;
  string platform = 3; // ios, android, unknown...
  string platform_version = 4;
  uint64 application_count = 5;
  uint64 record_count = 6;
}

message ListDevicesResponse {
  repeated DeviceInfo devices = 1;
  string next_page_token = 2;
}

// POST /v1/records/search
// Busca registros y metadatos. El contenido binario se obtiene con
// /v1/downloads/begin y /v1/downloads/chunk.
message SearchRecordsRequest {
  bytes device_id = 1;       // opcional: vacio = todos los dispositivos.
  string application_id = 2; // opcional.
  string data_category = 3;  // opcional: photo, video, audio, document, other...
  string file_name_contains = 4;
  int64 created_from_unix_ms = 5; // 0 = sin limite inferior.
  int64 created_to_unix_ms = 6;   // 0 = sin limite superior.
  string content_type_prefix = 7;
  uint32 page_size = 8;
  string page_token = 9;
  string sort_by = 10; // created_at, file_name, file_size.
  bool descending = 11;
}

message RecordInfo {
  bytes record_id = 1; // identificador opaco estable asignado por el servidor.
  bytes device_id = 2;
  string device_name = 3;
  string application_id = 4;
  string application_name = 5;
  string data_category = 6;
  string file_name = 7;
  string content_type = 8;
  uint64 file_size = 9;
  bytes sha256 = 10; // vacio solo si no esta disponible en los datos heredados.
  int64 created_at_unix_ms = 11; // 0 = desconocido.
  int64 imported_at_unix_ms = 12;
  bool content_available = 13;
}

message SearchRecordsResponse {
  repeated RecordInfo records = 1;
  string next_page_token = 2;
  uint64 total_count = 3; // 0 si el servidor no calcula el total.
}

// POST /v1/records/get
message GetRecordRequest {
  bytes record_id = 1;
}

message GetRecordResponse {
  RecordInfo record = 1;
}

// POST /v1/downloads/begin
message DownloadBeginRequest {
  bytes record_id = 1;
}

message DownloadBeginResponse {
  bytes download_id = 1;
  uint64 file_size = 2;
  bytes sha256 = 3;
  uint32 max_chunk_size = 4;
  uint32 next_chunk_index = 5;
  uint64 next_chunk_offset = 6;
}

// POST /v1/downloads/chunk
message DownloadChunkRequest {
  bytes download_id = 1;
  uint32 chunk_index = 2;
  uint64 chunk_offset = 3;
  uint32 requested_length = 4;
}

message DownloadChunkResponse {
  uint32 chunk_index = 1;
  uint64 chunk_offset = 2;
  bytes chunk_data = 3;
  bool is_last_chunk = 4;
}
