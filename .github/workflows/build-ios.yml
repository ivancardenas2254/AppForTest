name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build iOS (unsigned archive)
        run: |
          xcodebuild -project AppForTest.xcodeproj \
            -scheme AppForTest \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath build/AppForTest.xcarchive \
            archive
      
      - name: Create unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/AppForTest.xcarchive/Products/Applications/AppForTest.app build/Payload/
          cd build
          zip -r AppForTest-unsigned.ipa Payload/
      
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppForTest-unsigned
          path: build/AppForTest-unsigned.ipa
