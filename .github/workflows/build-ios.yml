name: Build iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Para ejecutar manualmente

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15  # o macos-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build iOS
        run: |
          xcodebuild -project AppForTest.xcodeproj \
            -scheme AppForTest \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath build/AppForTest.xcarchive \
            archive
      
      - name: Export .ipa (unsigned)
        run: |
          xcodebuild -exportArchive \
            -archivePath build/AppForTest.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist exportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Upload .ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppForTest
          path: build/AppForTest.ipa
